<svg xmlns="http://www.w3.org/2000/svg" width="919.1999999999999" height="410" viewBox="0 0 919.1999999999999 410" role="img" aria-label="③ 想对托管会话说一句话：在这里输入">
<rect width="919.1999999999999" height="410" rx="12" fill="#f6f7f9"/>
<text x="24" y="34" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#1f2328">③ 想对托管会话说一句话：在这里输入</text>
<text x="895.1999999999999" y="34" text-anchor="end" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8a8f94">示意图，文案取自面板源码</text>
<g transform="translate(24,54)">
<rect width="425.59999999999997" height="212" rx="9" fill="#1d1f21" stroke="#0e0f10"/>
<path d="M0 9 a9 9 0 0 1 9 -9 h407.59999999999997 a9 9 0 0 1 9 9 v19 h-425.59999999999997 z" fill="#2b2e31"/>
<circle cx="16" cy="14" r="5.5" fill="#ff5f57"/>
<circle cx="34" cy="14" r="5.5" fill="#febc2e"/>
<circle cx="52" cy="14" r="5.5" fill="#28c840"/>
<text x="212.79999999999998" y="18.5" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#9aa0a6">方式一：托管视图里按 Enter（下方分屏）</text>
<text x="10.0" y="49" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#8a8f94" xml:space="preserve">~/shop $ </text>
<text x="10.0" y="70" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#c5c8c6" xml:space="preserve"></text>
<rect x="4" y="76" width="417.59999999999997" height="21" fill="#3a3f45"/>
<text x="10.0" y="91" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#c5c8c6" xml:space="preserve"> xaya attach a1b2c3d4 · Claude 原生界面</text>
<text x="10.0" y="112" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#8a8f94" xml:space="preserve"> ⏺ Running cargo test --locked …</text>
<text x="10.0" y="133" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#e06c6c" xml:space="preserve">   3 passed, 1 failed</text>
<text x="10.0" y="154" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#c5c8c6" xml:space="preserve"></text>
<rect x="4" y="160" width="417.59999999999997" height="21" fill="#28384a"/>
<text x="10.0" y="175" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#ffffff" xml:space="preserve"> › 先别管测试，看下这个报错▏</text>
<text x="10.0" y="196" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#c5c8c6" xml:space="preserve"></text>
</g>
<g transform="translate(469.59999999999997,54)">
<rect width="425.59999999999997" height="212" rx="9" fill="#1d1f21" stroke="#0e0f10"/>
<path d="M0 9 a9 9 0 0 1 9 -9 h407.59999999999997 a9 9 0 0 1 9 9 v19 h-425.59999999999997 z" fill="#2b2e31"/>
<circle cx="16" cy="14" r="5.5" fill="#ff5f57"/>
<circle cx="34" cy="14" r="5.5" fill="#febc2e"/>
<circle cx="52" cy="14" r="5.5" fill="#28c840"/>
<text x="212.79999999999998" y="18.5" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#9aa0a6">方式二：命令行发送</text>
<text x="10.0" y="49" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#c5c8c6" xml:space="preserve">~/shop $ xaya agent session send a1b2c3d4 \</text>
<text x="10.0" y="70" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#c5c8c6" xml:space="preserve">    &quot;先别管测试，看下这个报错&quot;</text>
<text x="10.0" y="91" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#8a8f94" xml:space="preserve"># stderr 先打印生成的 command_id</text>
<text x="10.0" y="112" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#8a8f94" xml:space="preserve"># 返回命令回执：pending → succeeded</text>
<text x="10.0" y="133" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#c5c8c6" xml:space="preserve"></text>
<text x="10.0" y="154" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#c5c8c6" xml:space="preserve">~/shop $ xaya agent session command \</text>
<text x="10.0" y="175" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#c5c8c6" xml:space="preserve">    a1b2c3d4 &lt;command_id&gt;</text>
<text x="10.0" y="196" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#8a8f94" xml:space="preserve"># 回执是 unknown 时先查，不要重发</text>
</g>
<g transform="translate(24,284)">
<rect width="425.59999999999997" height="106" rx="8" fill="#0969da" fill-opacity="0.09" stroke="#0969da" stroke-width="1.3"/>
<rect width="5" height="106" rx="2" fill="#0969da"/>
<text x="18" y="26" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#0969da">原生界面里直接输入</text>
<text x="18" y="50" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#2d3135" xml:space="preserve">和平时用 claude / codex 一样</text>
<text x="18" y="72" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#2d3135" xml:space="preserve">关掉这个分屏，会话仍在后台运行</text>
</g>
<g transform="translate(469.59999999999997,284)">
<rect width="425.59999999999997" height="106" rx="8" fill="#0969da" fill-opacity="0.09" stroke="#0969da" stroke-width="1.3"/>
<rect width="5" height="106" rx="2" fill="#0969da"/>
<text x="18" y="26" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#0969da">命令行发送（适合脚本）</text>
<text x="18" y="50" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#2d3135" xml:space="preserve">同一 --command-id 重复发送不会执行两次</text>
<text x="18" y="72" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#2d3135" xml:space="preserve">可在任何终端里操作同一个会话</text>
</g>
</svg>