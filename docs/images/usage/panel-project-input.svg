<text x="18" y="26" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#9a6700">输入的是修改意见</text>
<text x="18" y="50" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#2d3135" xml:space="preserve">发给原来实现它的会话</text>
<text x="18" y="72" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#2d3135" xml:space="preserve">改完自动重新验证和审查</text>
