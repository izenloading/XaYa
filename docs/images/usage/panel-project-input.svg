<text x="10.0" y="91" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#81a2be" xml:space="preserve"> › 让 mean() 对空列表返回 0▏</text>
<text x="10.0" y="112" font-family="Menlo, 'SF Mono', Monaco, 'PingFang SC', monospace" font-size="13" fill="#8a8f94" xml:space="preserve"> Claude implements · Codex reviews</text>
