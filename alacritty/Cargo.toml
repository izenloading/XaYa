[package]
name = "alacritty"
version = "0.0.1"
authors = ["izenloading"]
license = "Apache-2.0"
description = "XaYa - A fast, cross-platform, GPU-accelerated terminal emulator"
readme = "README.md"
homepage = "https://github.com/izenloading/XaYa"
repository = "https://github.com/izenloading/XaYa"
edition.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "xaya"
path = "src/main.rs"

[dependencies.alacritty_terminal]
path = "../alacritty_terminal"
version = "0.26.1-dev"

[dependencies.alacritty_config_derive]
path = "../alacritty_config_derive"
version = "0.2.6-dev"

[dependencies.alacritty_config]
path = "../alacritty_config"
version = "0.2.4-dev"

[dependencies]
xaya_agent_proto = { path = "../xaya_agent_proto" }
ahash = { version = "0.8.6", features = ["no-rng"] }
bitflags = "2.2.1"
clap = { version = "4.2.7", features = ["derive", "env"] }
copypasta = { version = "0.10.1", default-features = false }
crossfont = "0.8.1"
glutin = { version = "0.32.2", default-features = false, features = ["egl", "wgl"] }
home = "0.5.5"
libc = "0.2"
log = { version = "0.4", features = ["std", "serde"] }
notify = "8.0.0"
parking_lot = "0.12.0"
polling = "3.11.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.25"
signal-hook = { version = "0.4.3", default-features = false }
tempfile = "3.12.0"
toml.workspace = true
toml_edit.workspace = true
unicode-width = "0.2.0"
winit = { version = "0.30.9", default-features = false, features = ["rwh_06", "serde"] }

[build-dependencies]
gl_generator = "0.14.0"

[dev-dependencies]
clap_complete = "4.2.3"

[target.'cfg(not(windows))'.dependencies]
xdg = "3.0.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
png = { version = "0.17.5", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder",
    "MTLRenderCommandEncoder", "MTLRenderPipeline", "MTLRenderPass", "MTLLibrary",
    "MTLBuffer", "MTLTexture", "MTLResource", "MTLDrawable", "MTLPixelFormat",
    "MTLBlitCommandEncoder", "MTLTypes", "MTLAllocation", "objc2-core-foundation",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std", "CALayer", "CAMetalLayer", "objc2-metal", "objc2-core-foundation", "objc2-core-graphics",
] }
raw-window-metal = "1.1.0"
block2 = "0.6.1"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "bitflags", "UNNotification", "UNNotificationContent",
    "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
objc2-foundation = { version = "0.3.1", default-features = false, features = [
    "std",
    "NSBundle",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSLocale",
    "NSProcessInfo",
    "NSObjCRuntime",
    "NSUserDefaults",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
    "std",
    "NSApplication",
    "NSColorSpace",
    "NSDockTile",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[target.'cfg(windows)'.dependencies]
dirs = "6.0.0"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Foundation",
]}

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.2"

[features]
default = ["wayland", "x11"]
x11 = [
    "copypasta/x11",
    "winit/x11",
    "glutin/x11",
    "glutin/glx",
    "png",
]
wayland = [
    "copypasta/wayland",
    "glutin/wayland",
    "winit/wayland",
    "winit/wayland-dlopen",
    "winit/wayland-csd-adwaita-crossfont",
]
nightly = []
