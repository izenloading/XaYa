[package]
name = "xaya_agentd"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "XaYa local agent service and command-line client"

[[bin]]
name = "xaya-agentd"
path = "src/main.rs"

[dependencies]
xaya_agent_proto = { path = "../xaya_agent_proto" }
clap = { version = "4.2.7", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
polling = "3.11.0"
signal-hook = { version = "0.4.3", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["rt", "net", "process", "io-util", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["codec"] }
tempfile = "3.12.0"
rusqlite = { version = "0.37", features = ["bundled"] }
toml.workspace = true
sha2 = "=0.10.8"

[dev-dependencies]
tempfile = "3.12.0"
